<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>อ้วนแคระ</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    .gallery {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap; /* ถ้าจอมือถือแคบจะปัดลงมาอัตโนมัติไม่เบียดกัน */
    }

    .gallery img {
      max-width: 28vw;
      max-height: 65vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    h1 {
      margin-top: 24px;
      font-size: 3rem;
      color: #000000;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="gallery">
    <!-- รูปด้านซ้าย -->
    <img src="images/fat2.jpg" alt="left.jpg">

    <!-- รูปตรงกลาง -->
    <img src="images/fat.jpg" alt="fat.jpg">

    <!-- รูปด้านขวา -->
    <img src="images/pig.jpg" alt="right.jpg">
  </div>

  <h1>อ้วนแคระ</h1>

</body>
</html>
